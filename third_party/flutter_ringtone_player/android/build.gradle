group 'io.inway.ringtone.player'
version '1.0-SNAPSHOT'

buildscript {
    repositories {
        google()
        mavenCentral()
    }

    dependencies {
        classpath 'com.android.tools.build:gradle:8.1.3'
    }
}

rootProject.allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

apply plugin: 'com.android.library'

android {
    // Bumped from 33 (upstream default): newer androidx.activity/lifecycle/core
    // versions pulled in transitively after this upgrade (via flutter_webrtc,
    // firebase_core/messaging, device_info_plus, permission_handler_android)
    // require any module in the graph to compile against API 34+.
    compileSdkVersion 36

    if (project.android.hasProperty("namespace")) {
        namespace "io.inway.ringtone.player"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    defaultConfig {
        minSdkVersion 16
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }

    lintOptions {
        disable 'InvalidPackage'
    }
}
